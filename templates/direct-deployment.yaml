{{- $deploymentMode := .Values.alloy.deploymentMode | default "alloy" }}
{{- if eq $deploymentMode "direct" }}
{{- $namespaces := .Values.discovery.namespaces | default (list .Release.Namespace) }}
{{- $replicas := .Values.alloy.replicas | default 3 }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redpanda-o11y.alloyResourceName" . }}-alloy
  namespace: {{ .Values.alloy.namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: {{ .Values.alloy.name }}
    app.kubernetes.io/component: alloy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: {{ .Values.alloy.name }}
  ports:
    - name: http-metrics
      port: 12345
      targetPort: 12345
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redpanda-o11y.alloyResourceName" . }}-alloy
  namespace: {{ .Values.alloy.namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: {{ .Values.alloy.name }}
    app.kubernetes.io/component: alloy
spec:
  replicas: {{ $replicas }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.alloy.maxUnavailable | default $replicas }}
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/instance: {{ .Values.alloy.name }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: alloy
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/instance: {{ .Values.alloy.name }}
    spec:
      serviceAccountName: {{ include "redpanda-o11y.alloyResourceName" . }}-alloy
      containers:
        # Main Alloy container
        - name: alloy
          image: {{ if .Values.alloy.image }}{{ .Values.alloy.image }}{{ else }}paulmw/alloy:v1.17.1-rp{{ end }}
          imagePullPolicy: IfNotPresent
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --server.http.ui-path-prefix=/
            - --stability.level=experimental
            - --server.http.enable-pprof=true
          env:
            - name: ALLOY_DEPLOY_MODE
              value: helm
            - name: POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
{{- if .Values.credentials.secretName }}
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: username
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: password
{{- else }}
            - name: KAFKA_USERNAME
              value: {{ .Values.credentials.username | quote }}
            - name: KAFKA_PASSWORD
              value: {{ .Values.credentials.password | quote }}
{{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
{{- if and .Values.gateway .Values.gateway.enabled .Values.gateway.protocol (eq .Values.gateway.protocol "grpc") }}
            # Disable ALPN enforcement for gRPC when using NLB with TLS termination
            - name: GRPC_ENFORCE_ALPN_ENABLED
              value: "false"
{{- end }}
{{- if and .Values.gateway .Values.gateway.credentials }}
{{- if .Values.gateway.credentials.secretName }}
            - name: GATEWAY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.credentials.secretName }}
                  key: username
            - name: GATEWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.credentials.secretName }}
                  key: password
{{- else }}
            - name: GATEWAY_USERNAME
              value: {{ .Values.gateway.credentials.username | quote }}
            - name: GATEWAY_PASSWORD
              value: {{ .Values.gateway.credentials.password | quote }}
{{- end }}
{{- end }}
          ports:
            - name: http-metrics
              containerPort: 12345
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: config
              mountPath: /etc/alloy

        # Config reloader sidecar
        - name: config-reloader
          image: quay.io/prometheus-operator/prometheus-config-reloader:v0.81.0
          imagePullPolicy: IfNotPresent
          args:
            - --watched-dir=/etc/alloy
            - --reload-url=http://localhost:12345/-/reload
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy

      volumes:
        - name: config
          configMap:
            name: {{ include "redpanda-o11y.alloyResourceName" . }}-alloy
{{- end }}
