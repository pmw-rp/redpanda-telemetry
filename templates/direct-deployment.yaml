{{- $deploymentMode := .Values.alloy.deploymentMode | default "alloy" }}
{{- if eq $deploymentMode "direct" }}
{{- $namespaces := .Values.discovery.namespaces | default (list .Release.Namespace) }}
{{- $replicas := .Values.alloy.replicas | default 3 }}
{{- $clustering := .Values.alloy.clustering | default false }}
{{- $clusterWaitForSize := .Values.alloy.clusterWaitForSize | default 2 }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redpanda-o11y.alloyResourceName" . }}-alloy
  namespace: {{ .Values.alloy.namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: {{ .Values.alloy.name }}
    app.kubernetes.io/component: alloy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: {{ .Values.alloy.name }}
  ports:
    - name: http-metrics
      port: 12345
      targetPort: 12345
{{- if $clustering }}
    # discovery.redpanda's raft_bind_port default (leave port/raft_bind_port in sync if ever changed)
    - name: raft
      port: 9700
      targetPort: 9700
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redpanda-o11y.alloyResourceName" . }}-alloy
  namespace: {{ .Values.alloy.namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: {{ .Values.alloy.name }}
    app.kubernetes.io/component: alloy
spec:
  replicas: {{ $replicas }}
{{- if $clustering }}
  # Per-pod DNS names (via the headless Service above) that Raft peers use
  # to address each other and survive a restart without going stale — see
  # discovery.redpanda's package doc comment. Not needed in the default,
  # non-clustering scheme.
  serviceName: {{ include "redpanda-o11y.alloyResourceName" . }}-alloy
{{- end }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.alloy.maxUnavailable | default $replicas }}
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/instance: {{ .Values.alloy.name }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: alloy
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/instance: {{ .Values.alloy.name }}
    spec:
      serviceAccountName: {{ include "redpanda-o11y.alloyResourceName" . }}-alloy
{{- if $clustering }}
      # The preStop hook below blocks pod termination until discovery.redpanda
      # has been cleanly removed as a raft voter, scaling its own wait budget
      # up to a cap of ~90s when many replicas are leaving at once (see
      # gracefulLeaveDeadline) — kubelet counts that time against this
      # budget, not on top of it, so it needs real headroom beyond even that
      # worst case for the container to actually exit afterward.
      terminationGracePeriodSeconds: 120
{{- end }}
      containers:
        # Main Alloy container
        - name: alloy
          image: {{ if .Values.alloy.image }}{{ .Values.alloy.image }}{{ else }}paulmw/alloy:v1.17.1-rp-0.2.0-dev-clustering{{ end }}
          imagePullPolicy: IfNotPresent
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --server.http.ui-path-prefix=/
            - --stability.level=experimental
            - --server.http.enable-pprof=true
{{- if $clustering }}
            # discovery.redpanda requires Alloy's native clustering to be enabled — it uses
            # cluster.Peers()/cluster.Ready() to decide broker-to-replica ownership and to avoid
            # every replica scraping everything before the fleet has actually converged.
            - --cluster.enabled=true
            - --cluster.join-addresses=dns+{{ include "redpanda-o11y.alloyResourceName" . }}-alloy.{{ .Values.alloy.namespace }}.svc.cluster.local:12345
            - --cluster.wait-for-size={{ $clusterWaitForSize }}
{{- end }}
          env:
            - name: ALLOY_DEPLOY_MODE
              value: helm
{{- if not $clustering }}
            # Used by discovery.redpanda's default (non-clustering) scheme to
            # shard scrape targets by __tmp_pod_ordinal % num_shards — see
            # direct-configmap.yaml.
            - name: POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
{{- end }}
{{- if .Values.credentials.secretName }}
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: username
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: password
{{- else }}
            - name: KAFKA_USERNAME
              value: {{ .Values.credentials.username | quote }}
            - name: KAFKA_PASSWORD
              value: {{ .Values.credentials.password | quote }}
{{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
{{- if and .Values.gateway .Values.gateway.enabled .Values.gateway.protocol (eq .Values.gateway.protocol "grpc") }}
            # Disable ALPN enforcement for gRPC when using NLB with TLS termination
            - name: GRPC_ENFORCE_ALPN_ENABLED
              value: "false"
{{- end }}
{{- if and .Values.gateway .Values.gateway.credentials }}
{{- if .Values.gateway.credentials.secretName }}
            - name: GATEWAY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.credentials.secretName }}
                  key: username
            - name: GATEWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.credentials.secretName }}
                  key: password
{{- else }}
            - name: GATEWAY_USERNAME
              value: {{ .Values.gateway.credentials.username | quote }}
            - name: GATEWAY_PASSWORD
              value: {{ .Values.gateway.credentials.password | quote }}
{{- end }}
{{- end }}
          ports:
            - name: http-metrics
              containerPort: 12345
              protocol: TCP
{{- if $clustering }}
            - name: raft
              containerPort: 9700
              protocol: TCP
{{- end }}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
{{- if $clustering }}
          lifecycle:
            preStop:
              # Asks discovery.redpanda to gracefully leave the raft group
              # before this pod is torn down — see the component's Handler/
              # handleLeave. Kubernetes doesn't send SIGTERM until this
              # returns, so raft voter removal happens one at a time no
              # matter how many replicas are scaled down in a single step,
              # instead of racing ahead of the leader's reconcile tick.
              httpGet:
                path: /api/v0/component/discovery.redpanda.pods/leave
                port: 12345
                scheme: HTTP
{{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/alloy

        # Config reloader sidecar
        - name: config-reloader
          image: quay.io/prometheus-operator/prometheus-config-reloader:v0.81.0
          imagePullPolicy: IfNotPresent
          args:
            - --watched-dir=/etc/alloy
            - --reload-url=http://localhost:12345/-/reload
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy

      volumes:
        - name: config
          configMap:
            name: {{ include "redpanda-o11y.alloyResourceName" . }}-alloy
{{- end }}
