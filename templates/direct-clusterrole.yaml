{{- $deploymentMode := .Values.alloy.deploymentMode | default "alloy" }}
{{- if eq $deploymentMode "direct" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "redpanda-o11y.alloyResourceName" . }}-alloy
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: {{ .Values.alloy.name }}
    app.kubernetes.io/component: rbac
rules:
  # Pod discovery (prometheus.scrape + loki.source.kubernetes)
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
    verbs: ["get", "list", "watch"]

  # Pod log collection (loki.source.kubernetes)
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get"]
{{- end }}
