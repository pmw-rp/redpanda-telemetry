{{- $deploymentMode := .Values.alloy.deploymentMode | default "alloy" }}
{{- if eq $deploymentMode "alloy" }}
{{- $namespaces := .Values.discovery.namespaces | default (list .Release.Namespace) }}
{{- $adminPort := .Values.discovery.adminPort | default 9644 }}
{{- $parseSeverity := ne ((.Values.logs).parseSeverity | toString) "false" }}
apiVersion: collectors.grafana.com/v1alpha1
kind: Alloy
metadata:
  name: {{ include "redpanda-o11y.alloyResourceName" . }}
  namespace: {{ .Values.alloy.namespace }}
spec:
  {{- $defaultImage := "paulmw/alloy:v1.17.1-rp" }}
  {{- $imageStr := .Values.alloy.image | default $defaultImage }}
  {{- $imageParts := splitList ":" $imageStr }}
  image:
    registry: docker.io
    repository: {{ first $imageParts }}
    tag: {{ last $imageParts }}
  controller:
    type: statefulset
    replicas: {{ .Values.alloy.replicas | default 3 }}
  clustering:
    enabled: true
    name: {{ include "redpanda-o11y.alloyResourceName" . }}
    portName: http-metrics
  alloy:
    stabilityLevel: experimental
    extraEnv:
      - name: POD_INDEX
        valueFrom:
          fieldRef:
            fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
{{- if .Values.credentials.secretName }}
      - name: KAFKA_USERNAME
        valueFrom:
          secretKeyRef:
            name: {{ .Values.credentials.secretName }}
            key: username
      - name: KAFKA_PASSWORD
        valueFrom:
          secretKeyRef:
            name: {{ .Values.credentials.secretName }}
            key: password
{{- else }}
      - name: KAFKA_USERNAME
        value: {{ .Values.credentials.username | quote }}
      - name: KAFKA_PASSWORD
        value: {{ .Values.credentials.password | quote }}
{{- end }}
{{- if and .Values.gateway .Values.gateway.enabled .Values.gateway.protocol (eq .Values.gateway.protocol "grpc") }}
      - name: GRPC_ENFORCE_ALPN_ENABLED
        value: "false"
{{- end }}
{{- if and .Values.gateway .Values.gateway.credentials }}
{{- if .Values.gateway.credentials.secretName }}
      - name: GATEWAY_USERNAME
        valueFrom:
          secretKeyRef:
            name: {{ .Values.gateway.credentials.secretName }}
            key: username
      - name: GATEWAY_PASSWORD
        valueFrom:
          secretKeyRef:
            name: {{ .Values.gateway.credentials.secretName }}
            key: password
{{- else }}
      - name: GATEWAY_USERNAME
        value: {{ .Values.gateway.credentials.username | quote }}
      - name: GATEWAY_PASSWORD
        value: {{ .Values.gateway.credentials.password | quote }}
{{- end }}
{{- end }}
    configMap:
      content: |
        logging {
          level  = {{ .Values.alloy.logLevel | default "info" | quote }}
          format = "logfmt"
        }
        {{- if .Values.alloy.liveDebugging }}

        livedebugging {
          enabled = true
        }
        {{- end }}

        // Discover Kubernetes pods with metrics endpoints
        discovery.kubernetes "pods" {
          role = "pod"

          namespaces {
            names = [{{ range $i, $ns := $namespaces }}{{ if $i }}, {{ end }}{{ $ns | quote }}{{ end }}]
          }

          selectors {
            role  = "pod"
            label = {{ .Values.discovery.labelSelector | default "app.kubernetes.io/name=redpanda" | quote }}
          }
        }

        // Enrich each discovered pod with its Redpanda cluster ID by querying
        // the admin API.  The cluster_id label is carried through all downstream
        // relabeling and scraping so each cluster's telemetry can be routed to its
        // own Kafka topic without a shared remote.http fetch. Whether that admin API
        // actually speaks TLS is detected per-pod, not configured — see
        // __tmp_admin_tls_enabled below — since a fleet of monitored Redpanda clusters
        // isn't guaranteed to be uniformly TLS or plaintext.
        discovery.redpanda "pods" {
          targets    = discovery.kubernetes.pods.targets
          admin_port = {{ $adminPort }}
          num_shards = {{ .Values.alloy.replicas | default 3 }}
          tls_skip_verify = true
        }

        // Relabel discovered targets to only scrape annotated pods
        discovery.relabel "kubernetes_pods" {
          targets = discovery.redpanda.pods.targets

          // Only scrape pods with the Redpanda admin port
          rule {
            source_labels = ["__meta_kubernetes_pod_container_port_number"]
            action        = "keep"
            regex         = {{ .Values.discovery.adminPort | default 9644 | quote }}
          }

          // Route each target's scrape at whatever scheme discovery.redpanda
          // actually detected for its admin API (see __tmp_admin_tls_enabled) —
          // a fleet of monitored Redpanda clusters isn't guaranteed to be
          // uniformly TLS or plaintext.
          rule {
            source_labels = ["__tmp_admin_tls_enabled"]
            regex         = "true"
            target_label  = "__scheme__"
            replacement   = "https"
          }
          rule {
            source_labels = ["__tmp_admin_tls_enabled"]
            regex         = "false"
            target_label  = "__scheme__"
            replacement   = "http"
          }

          // Label creation - "namespace" field from "__meta_kubernetes_namespace"
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            action = "replace"
            target_label = "namespace"
          }

          // Label creation - "pod" field from "__meta_kubernetes_pod_name"
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            action = "replace"
            target_label = "pod"
          }

          // Label creation - "container" field from "__meta_kubernetes_pod_container_name"
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            action = "replace"
            target_label = "container"
          }

          // Label creation -  "app" field from "__meta_kubernetes_pod_label_app_kubernetes_io_name"
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            action = "replace"
            target_label = "app"
          }

          // Label creation -  "job" field from "__meta_kubernetes_namespace" and "__meta_kubernetes_pod_container_name"
          // Concatenate values __meta_kubernetes_namespace/__meta_kubernetes_pod_container_name
          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
            action = "replace"
            target_label = "job"
            separator = "/"
            replacement = "$1"
          }

          // Label creation - "container" field from "__meta_kubernetes_pod_uid" and "__meta_kubernetes_pod_container_name"
          // Concatenate values __meta_kubernetes_pod_uid/__meta_kubernetes_pod_container_name.log
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            action = "replace"
            target_label = "__path__"
            separator = "/"
            replacement = "/var/log/pods/*$1/*.log"
          }

          // Label creation -  "container_runtime" field from "__meta_kubernetes_pod_container_id"
          rule {
            source_labels = ["__meta_kubernetes_pod_container_id"]
            action = "replace"
            target_label = "container_runtime"
            regex = "^(\\S+):\\/\\/.+$"
            replacement = "$1"
          }

          // Static rule - redpanda source type
          rule {
            target_label = "redpanda_source"
            replacement  = "self_managed"
          }

          // Add endpoint identifier
          rule {
            target_label = "endpoint"
            replacement  = "metrics"
          }

          // Shard targets: each collector pod scrapes only the Redpanda pod
          // whose global ordinal (assigned by discovery.redpanda) matches
          // this collector's own StatefulSet index.
          rule {
            source_labels = ["__tmp_pod_ordinal"]
            regex         = env("POD_INDEX")
            action        = "keep"
          }

        }

        // Relabel discovered targets for /public_metrics endpoint
        discovery.relabel "kubernetes_pods_public" {
          targets = discovery.relabel.kubernetes_pods.output

          // Set the metrics path to /public_metrics
          rule {
            target_label = "__metrics_path__"
            replacement  = "/public_metrics"
          }

          // Add endpoint identifier
          rule {
            target_label = "endpoint"
            replacement  = "public_metrics"
          }
        }

        {{- if and .Values.gateway .Values.gateway.enabled }}
        // Basic Auth for Gateway
        otelcol.auth.basic "gateway" {
          {{- if .Values.gateway.credentials }}
          username = env("GATEWAY_USERNAME")
          password = env("GATEWAY_PASSWORD")
          {{- else }}
          username = env("KAFKA_USERNAME")
          password = env("KAFKA_PASSWORD")
          {{- end }}
        }
        {{- end }}

        // Scrape metrics from discovered pods. No scheme set here — each
        // target's own __scheme__ (set above from __tmp_admin_tls_enabled)
        // decides http vs https per pod; tls_config is simply unused for
        // any target that resolves to http.
        prometheus.scrape "kubernetes_metrics" {
          targets    = discovery.relabel.kubernetes_pods.output
          forward_to = [otelcol.receiver.prometheus.default.receiver]
          scrape_interval = {{ .Values.discovery.scrapeInterval | default "30s" | quote }}
          scrape_timeout  = {{ .Values.discovery.scrapeTimeout | default "10s" | quote }}
          tls_config {
            insecure_skip_verify = true
          }
        }

        prometheus.scrape "kubernetes_metrics_public" {
          targets    = discovery.relabel.kubernetes_pods_public.output
          forward_to = [otelcol.receiver.prometheus.default.receiver]
          scrape_interval = {{ .Values.discovery.scrapeInterval | default "30s" | quote }}
          scrape_timeout  = {{ .Values.discovery.scrapeTimeout | default "10s" | quote }}
          tls_config {
            insecure_skip_verify = true
          }
        }

        // Convert Prometheus metrics to OpenTelemetry format
        otelcol.receiver.prometheus "default" {
          output {
            metrics = [otelcol.processor.transform.add_cluster_id.input]
          }
        }

        // Promote cluster_id (scraped as a metric label from the discovery target)
        // to the resource attribute used for Kafka topic routing.
        otelcol.processor.transform "add_cluster_id" {
          error_mode = "ignore"

          metric_statements {
            context = "datapoint"
            statements = [
              `set(resource.attributes["cluster_id"], datapoint.attributes["cluster_id"])`,
              `delete_key(datapoint.attributes, "cluster_id")`,
            ]
          }

          output {
            metrics = [otelcol.processor.metricsbatcher.default.input]
          }
        }

        // Metrics-batch processing: keeps all data points for the same (resource, metric name)
        // together so that Prometheus histogram families (_bucket/_sum/_count) are never
        // split across separate Kafka messages.
        otelcol.processor.metricsbatcher "default" {
          send_batch_max_size = {{ if .Values.batch }}{{ .Values.batch.metricsBatchMaxSize }}{{ else }}5000{{ end }}
          timeout             = {{ if .Values.batch }}{{ .Values.batch.timeout | quote }}{{ else }}"2s"{{ end }}

          output {
            {{- if and .Values.gateway .Values.gateway.enabled }}
            {{- if and .Values.gateway.protocol (eq .Values.gateway.protocol "grpc") }}
            metrics = [otelcol.exporter.otlp.metrics_gateway.input]
            {{- else }}
            metrics = [otelcol.exporter.otlphttp.metrics_gateway.input]
            {{- end }}
            {{- else }}
            metrics = [otelcol.exporter.kafka_router.kafka.input]
            {{- end }}
          }
        }
        {{- if and .Values.gateway .Values.gateway.enabled }}

        {{- if and .Values.gateway.protocol (eq .Values.gateway.protocol "grpc") }}
        // Export metrics to Gateway via OTLP gRPC (more efficient than HTTP, with Basic Auth)
        otelcol.exporter.otlp "metrics_gateway" {
          client {
            endpoint = {{ .Values.gateway.endpoint | quote }}
            auth = otelcol.auth.basic.gateway.handler
            {{- if .Values.gateway.tls }}
            tls {
              insecure             = {{ .Values.gateway.tls.insecure }}
              insecure_skip_verify = {{ .Values.gateway.tls.insecure_skip_verify }}
            }
            {{- end }}
          }

          {{- if .Values.exportQueue }}
          sending_queue {
            enabled = {{ if .Values.exportQueue.enabled }}{{ .Values.exportQueue.enabled }}{{ else }}true{{ end }}
            queue_size = {{ if .Values.exportQueue.metricsQueueSize }}{{ .Values.exportQueue.metricsQueueSize }}{{ else }}50000{{ end }}
            num_consumers = {{ if .Values.exportQueue.numConsumers }}{{ .Values.exportQueue.numConsumers }}{{ else }}20{{ end }}
          }
          {{- end }}
        }
        {{- else }}
        // Export metrics to Gateway via OTLP HTTP (with Basic Auth)
        otelcol.exporter.otlphttp "metrics_gateway" {
          client {
            endpoint = {{ .Values.gateway.endpoint | quote }}
            auth = otelcol.auth.basic.gateway.handler
            {{- if .Values.gateway.tls }}
            tls {
              insecure             = {{ .Values.gateway.tls.insecure }}
              insecure_skip_verify = {{ .Values.gateway.tls.insecure_skip_verify }}
            }
            {{- end }}
          }

          {{- if .Values.exportQueue }}
          sending_queue {
            enabled = {{ if .Values.exportQueue.enabled }}{{ .Values.exportQueue.enabled }}{{ else }}true{{ end }}
            queue_size = {{ if .Values.exportQueue.metricsQueueSize }}{{ .Values.exportQueue.metricsQueueSize }}{{ else }}50000{{ end }}
            num_consumers = {{ if .Values.exportQueue.numConsumers }}{{ .Values.exportQueue.numConsumers }}{{ else }}20{{ end }}
          }
          {{- end }}
        }
        {{- end }}
        {{- end }}

        // discovery.relabel rewrites the label set of the input targets by applying one or more relabeling rules.
        // If no rules are defined, then the input targets are exported as-is.
        discovery.relabel "pod_logs" {
          targets = discovery.redpanda.pods.targets

          // Label creation - "namespace" field from "__meta_kubernetes_namespace"
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            action = "replace"
            target_label = "namespace"
          }

          // Label creation - "pod" field from "__meta_kubernetes_pod_name"
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            action = "replace"
            target_label = "pod"
          }

          // Label creation - "container" field from "__meta_kubernetes_pod_container_name"
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            action = "replace"
            target_label = "container"
          }

          // Label creation -  "app" field from "__meta_kubernetes_pod_label_app_kubernetes_io_name"
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            action = "replace"
            target_label = "app"
          }

          // Label creation -  "job" field from "__meta_kubernetes_namespace" and "__meta_kubernetes_pod_container_name"
          // Concatenate values __meta_kubernetes_namespace/__meta_kubernetes_pod_container_name
          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
            action = "replace"
            target_label = "job"
            separator = "/"
            replacement = "$1"
          }

          // Label creation - "container" field from "__meta_kubernetes_pod_uid" and "__meta_kubernetes_pod_container_name"
          // Concatenate values __meta_kubernetes_pod_uid/__meta_kubernetes_pod_container_name.log
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            action = "replace"
            target_label = "__path__"
            separator = "/"
            replacement = "/var/log/pods/*$1/*.log"
          }

          // Label creation -  "container_runtime" field from "__meta_kubernetes_pod_container_id"
          rule {
            source_labels = ["__meta_kubernetes_pod_container_id"]
            action = "replace"
            target_label = "container_runtime"
            regex = "^(\\S+):\\/\\/.+$"
            replacement = "$1"
          }

          // Shard log targets by pod ordinal (mirrors kubernetes_pods filter).
          rule {
            source_labels = ["__tmp_pod_ordinal"]
            regex         = env("POD_INDEX")
            action        = "keep"
          }
        }

        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.relabel.relabeller.receiver]
        }

        loki.relabel "relabeller" {

          // Static rule - redpanda source type
          rule {
            target_label = "redpanda_source"
            replacement  = "self_managed"
          }

          rule {
            action = "labeldrop"
            regex  = "app"
          }

          rule {
            action = "labeldrop"
            regex  = "container_runtime"
          }

          forward_to = [otelcol.receiver.loki.default.receiver]
        }

        otelcol.receiver.loki "default" {
          output {
            logs = [otelcol.processor.transform.add_cluster_id_logs.input]
          }
        }

        // cluster_id arrives as a log record attribute (Loki labels map to
        // record attrs via otelcol.receiver.loki).  Promote it to a resource
        // attribute so kafka_router can use it for topic routing.
        otelcol.processor.transform "add_cluster_id_logs" {
          error_mode = "ignore"

          log_statements {
            context = "log"
            statements = [
              `set(resource.attributes["cluster_id"], log.attributes["cluster_id"])`,
              {{- if $parseSeverity }}
              `set(log.severity_text, ExtractPatterns(log.body, "^(?P<sev>TRACE|DEBUG|INFO|WARN|ERROR|FATAL)\\s")["sev"]) where IsMatch(log.body, "^(TRACE|DEBUG|INFO|WARN|ERROR|FATAL)\\s")`,
              `set(log.severity_number, SEVERITY_NUMBER_TRACE) where log.severity_text == "TRACE"`,
              `set(log.severity_number, SEVERITY_NUMBER_DEBUG) where log.severity_text == "DEBUG"`,
              `set(log.severity_number, SEVERITY_NUMBER_INFO) where log.severity_text == "INFO"`,
              `set(log.severity_number, SEVERITY_NUMBER_WARN) where log.severity_text == "WARN"`,
              `set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.severity_text == "ERROR"`,
              `set(log.severity_number, SEVERITY_NUMBER_FATAL) where log.severity_text == "FATAL"`,
              {{- end }}
            ]
          }

          output {
            logs = [otelcol.processor.batch.batcher.input]
          }
        }

        otelcol.processor.batch "batcher" {
          timeout = {{ if .Values.batch }}{{ .Values.batch.timeout | quote }}{{ else }}"2s"{{ end }}
          send_batch_size = {{ if .Values.batch }}{{ .Values.batch.logsBatchSize }}{{ else }}10000{{ end }}
          send_batch_max_size = {{ if .Values.batch }}{{ .Values.batch.logsBatchSize }}{{ else }}10000{{ end }}
          output {
            {{- if and .Values.gateway .Values.gateway.enabled }}
            {{- if and .Values.gateway.protocol (eq .Values.gateway.protocol "grpc") }}
            logs = [otelcol.exporter.otlp.logs_gateway.input]
            {{- else }}
            logs = [otelcol.exporter.otlphttp.logs_gateway.input]
            {{- end }}
            {{- else }}
            logs = [otelcol.exporter.kafka_router.kafka.input]
            {{- end }}
          }
        }
        {{- if and .Values.gateway .Values.gateway.enabled }}

        {{- if and .Values.gateway.protocol (eq .Values.gateway.protocol "grpc") }}
        // Export logs to Gateway via OTLP gRPC (more efficient than HTTP, with Basic Auth)
        otelcol.exporter.otlp "logs_gateway" {
          client {
            endpoint = {{ .Values.gateway.endpoint | quote }}
            auth = otelcol.auth.basic.gateway.handler
            {{- if .Values.gateway.tls }}
            tls {
              insecure             = {{ .Values.gateway.tls.insecure }}
              insecure_skip_verify = {{ .Values.gateway.tls.insecure_skip_verify }}
            }
            {{- end }}
          }

          {{- if .Values.exportQueue }}
          sending_queue {
            enabled = {{ if .Values.exportQueue.enabled }}{{ .Values.exportQueue.enabled }}{{ else }}true{{ end }}
            queue_size = {{ if .Values.exportQueue.logsQueueSize }}{{ .Values.exportQueue.logsQueueSize }}{{ else }}50000{{ end }}
            num_consumers = {{ if .Values.exportQueue.numConsumers }}{{ .Values.exportQueue.numConsumers }}{{ else }}20{{ end }}
          }
          {{- end }}
        }
        {{- else }}
        // Export logs to Gateway via OTLP HTTP (with Basic Auth)
        otelcol.exporter.otlphttp "logs_gateway" {
          client {
            endpoint = {{ .Values.gateway.endpoint | quote }}
            auth = otelcol.auth.basic.gateway.handler
            {{- if .Values.gateway.tls }}
            tls {
              insecure             = {{ .Values.gateway.tls.insecure }}
              insecure_skip_verify = {{ .Values.gateway.tls.insecure_skip_verify }}
            }
            {{- end }}
          }

          {{- if .Values.exportQueue }}
          sending_queue {
            enabled = {{ if .Values.exportQueue.enabled }}{{ .Values.exportQueue.enabled }}{{ else }}true{{ end }}
            queue_size = {{ if .Values.exportQueue.logsQueueSize }}{{ .Values.exportQueue.logsQueueSize }}{{ else }}50000{{ end }}
            num_consumers = {{ if .Values.exportQueue.numConsumers }}{{ .Values.exportQueue.numConsumers }}{{ else }}20{{ end }}
          }
          {{- end }}
        }
        {{- end }}
        {{- else }}

        // Route telemetry to per-cluster Kafka topics.  The cluster_id resource
        // attribute (promoted from the cluster_uuid discovery label) selects the
        // cluster-specific topic; if that topic does not yet exist the produce
        // is retried on the customer default topic.  Data with no cluster_id is
        // dropped.
        otelcol.exporter.kafka_router "kafka" {
          brokers         = [{{ if .Values.redpanda }}{{ .Values.redpanda.bootstrapServer | quote }}{{ else }}"seed-47aa9fc7.d61ib847ecku8d3si4c0.byoc.prd.cloud.redpanda.com:9092"{{ end }}]
          max_batch_bytes = {{ if .Values.producer }}{{ .Values.producer.maxBatchBytes | default 10485760 }}{{ else }}10485760{{ end }}

          vars = {
            "customer" = {{ required "customer name is required" .Values.customer | quote }},
          }

          route {
            topic          = "${customer}-${signal}-${cluster_id}"
            fallback_topic = "${customer}-${signal}-default"
            required_attrs = ["cluster_id"]
          }

          sasl {
            mechanism = {{ if .Values.redpanda }}{{ .Values.redpanda.saslMechanism | quote }}{{ else }}"SCRAM-SHA-256"{{ end }}
            username  = env("KAFKA_USERNAME")
            password  = env("KAFKA_PASSWORD")
          }

          tls {
            insecure = false
          }
        }
        {{- end }}
{{- end }}
